<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="case-study.css">
<link rel="stylesheet" href="camera.css">
<style>body{margin:0;padding:26px;background:#FDFBEF;width:799px}
.cs-figure{margin:0 0 34px}
/* the page gates the machines on .is-in; assert it here */
.cs-figure{opacity:1!important;transform:none!important}</style>
<div class="pt"><figure class="cs-figure">
        <div class="cs-media cam cam-stage moves" style="--pw:2200px;--ph:662px;--plate-r:7px;--dur:13s;--n:1;--x0:46.0px;--y0:89.1px;--k0:0.3214;--x1:-52.4px;--y1:0.0px;--k1:0.6033">
          <div class="plate">
            <img class="rest" style="--i:0" src="assets/plate/dorms-reviews.webp" alt="A dorm's review list with star ratings" loading="lazy">
          </div>
          <div class="call" style="--cx:589.0px;--cy:167.1px;--cw:190px">
            <div class="call-row"><span class="call-line"></span><span class="call-note">5 stars</span></div>
            <p class="call-desc">The rating and the words are one submission; the site lays them out at opposite ends of the card.</p>
          </div>
        </div>
        <figcaption class="cs-caption">Named in the intro of every version of this project and, until now, shown nowhere. Author names are blurred; these are real students.</figcaption>
      </figure>
<figure class="cs-figure">
        <div class="cs-media cam cam-stage moves" style="--pw:1568px;--ph:751px;--plate-r:7px;--dur:13s;--n:1;--x0:87.4px;--y0:46.0px;--k0:0.3981;--x1:-308.9px;--y1:-14.8px;--k1:0.7648">
          <div class="plate">
            <img class="rest" style="--i:0" src="assets/plate/dorms-signin-gate.webp" alt="Google sign-in, restricted to brown.edu accounts" loading="lazy">
          </div>
          <div class="call" style="--cx:589.0px;--cy:169.5px;--cw:190px">
            <div class="call-row"><span class="call-line"></span><span class="call-note">brown.edu only</span></div>
            <p class="call-desc">The whole gate, and the reason a review here is worth more than one anywhere else.</p>
          </div>
        </div>
        <figcaption class="cs-caption">The gate is what makes a review worth reading: it comes from somebody who actually lives there. Signed out, because a real account has no business in a portfolio screenshot.</figcaption>
      </figure>
<figure class="cs-figure">
        <div class="cs-media cam cam-stage moves pans" style="--pw:2200px;--ph:744px;--plate-r:7px;--dur:13s;--n:1;--x0:46.0px;--y0:76.0px;--k0:0.3214;--x1:-115.7px;--y1:0.0px;--x2:-115.7px;--y2:-140.6px;--k1:0.7145">
          <div class="plate">
            <img class="rest" style="--i:0" src="assets/plate/dorms-floorplans-multibuilding.webp" alt="Floor plans grouped into one card grid per building" loading="lazy">
          </div>
          <div class="call" style="--cx:589.0px;--cy:163.3px;--cw:190px">
            <div class="call-row"><span class="call-line"></span><span class="call-note">one group per building</span></div>
            <p class="call-desc">Archibald-Bronson, then Everett-Poland. A flat list would run these together.</p>
          </div>
        </div>
        <figcaption class="cs-caption">Five of the thirty dorms are several buildings. A flat list of plans is wrong for those and quietly misleading to anyone who does not already know it.</figcaption>
      </figure>
<figure class="cs-figure">
        <div class="cs-media cam cam-stage moves" style="--pw:2200px;--ph:808px;--plate-r:7px;--dur:13s;--n:1;--x0:46.0px;--y0:65.7px;--k0:0.3214;--x1:0.0px;--y1:-55.2px;--k1:0.6268">
          <div class="plate">
            <img class="rest" style="--i:0" src="assets/plate/dorms-gallery-letterbox.webp" alt="A tall phone photo letterboxed over a blurred copy of itself" loading="lazy">
          </div>
          <div class="call" style="--cx:414.6px;--cy:169.5px;--cw:190px">
            <div class="call-row"><span class="call-line"></span><span class="call-note">the same photo</span></div>
            <p class="call-desc">Blurred and darkened to fill the frame, so a tall photo keeps its top and its bottom.</p>
          </div>
        </div>
        <figcaption class="cs-caption">Nothing is cropped and the frame keeps its size. What fills the rest is the same photograph, blurred and darkened.</figcaption>
      </figure>
<figure class="cs-figure">
        <div class="cs-media cam cam-stage moves" style="--pw:2200px;--ph:1100px;--plate-r:7px;--dur:13s;--n:1;--x0:100.5px;--y0:46.0px;--k0:0.2718;--x1:-316.7px;--y1:-206.3px;--k1:0.5430">
          <div class="plate">
            <img class="rest" style="--i:0" src="assets/plate/stardew-villager-abigail.webp" alt="A villager card: bracketed portrait, birthday, biography, loved and liked gifts" loading="lazy">
          </div>
          <div class="call" style="--cx:589.0px;--cy:185.8px;--cw:190px">
            <div class="call-row"><span class="call-line"></span><span class="call-note">the game's own heart</span></div>
            <p class="call-desc">A friendship sprite lifted from the game, not an emoji standing in for one.</p>
          </div>
        </div>
        <figcaption class="cs-caption">The hearts beside Loves and Likes are the game's own friendship sprites rather than emoji, which is the sort of detail the whole pastiche rests on.</figcaption>
      </figure>
<figure class="cs-figure">
        <div class="cs-media cam cam-stage moves" style="--pw:2200px;--ph:498px;--plate-r:7px;--dur:13s;--n:1;--x0:46.0px;--y0:115.5px;--k0:0.3214;--x1:-79.4px;--y1:96.1px;--k1:0.3993">
          <div class="plate">
            <img class="rest" style="--i:0" src="assets/plate/stardew-arcade-row.webp" alt="Four arcade cabinets side by side" loading="lazy">
          </div>
          <div class="call right" style="--cx:20.0px;--cy:199.8px;--cw:190px">
            <div class="call-row"><span class="call-line"></span><span class="call-note">four cabinets</span></div>
            <p class="call-desc">One canvas each, one loop each, and no engine under any of them.</p>
          </div>
        </div>
        <figcaption class="cs-caption">Junimo Kart, Fishing, Prairie King and Junimo Jamboree. Each is a plain canvas with its own loop and no engine under it.</figcaption>
      </figure></div>
<script>document.querySelectorAll(".cs-figure").forEach(e=>e.classList.add("is-in"))</script>
